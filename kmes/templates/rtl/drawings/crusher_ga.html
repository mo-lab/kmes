<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
<style>
  .dashboard-bg {
    background: url("{% static 'images/ga2.jpg' %}") no-repeat fixed;
    background-size: contain;
    min-height: 100vh;
    position: relative;
    width: 100%;

  }
  .main-container {
    background-color: rgba(255, 255, 255, 0.85);
    border-radius: 1rem;
    padding: 3rem;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
  }
  .image-container {
    position: relative;
    width: 800px;
    height: 600px;
    background-size: cover;
    /*background-position: center;*/
    background-attachment: fixed; /*!* if you want fixed *!*/
  }

  .hotspot {
    position: absolute;
    display: block;
    cursor: pointer;
    /* Make it visible for debugging */
    background: rgba(255, 0, 0, 0.3);
    transform: translate(-50%, -50%);
  }
</style>
<div class="dashboard-bg">
  <a href="{% url 'core:equipment-tag-detail' 1897 %}" class="hotspot" style="top: 5.8rem; left: 164px; width: 10px; height: 10px;"></a>
  <a href="{% url 'core:equipment-tag-detail' 1897 %}" class="hotspot" style="top: 71.5%; left: 34.5%; width: 17px; height: 7px;"></a>
  <a href="{% url 'core:dust_bonnet' %}" class="hotspot" style="top: 51.2%; left: 46.7%; width: 10px; height: 10px;"></a>

</div>
</body>
</html>
