{% extends 'rtl/base.html' %}
{% load static %}

{% block title %}افزودن نیازمندی{% endblock %}

{% block content %}
<div class="container py-4">
  <h2 class="mb-4">افزودن نیازمندی</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label">عنوان</label>
        {{ form.name }}
      </div>
      <div class="col-md-4">
        <label class="form-label">اولویت</label>
        {{ form.priority }}
      </div>
      <div class="col-12">
        <label class="form-label">توضیحات</label>
        {{ form.description }}
      </div>
    </div>
    <div class="mt-3">
      <button type="submit" class="btn btn-primary">ذخیره</button>
      <a href="{% url 'construction:work_package_detail' view.kwargs.wp_pk %}" class="btn btn-outline-secondary">انصراف</a>
    </div>
  </form>
</div>
{% endblock %}
